<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Electronic Journey 隐私优先的数字旅程记录工具"
    />
    <meta name="theme-color" content="#f7f7f8" />
    <title>Electronic Journey</title>
    <style>
      html,
      body,
      #root {
        width: 100%;
        height: 100%;
        margin: 0;
      }

      body {
        overflow: hidden;
        color: #202124;
        background: #f7f7f8;
        font-family:
          -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI",
          sans-serif;
      }

      .startup-shell {
        display: grid;
        grid-template-columns: 222px minmax(0, 1fr);
        height: 100%;
      }

      .startup-sidebar {
        padding: 44px 22px;
        color: #858995;
        background: #eef0f4;
        border-right: 1px solid rgba(15, 23, 42, 0.1);
        font-size: 11px;
        font-weight: 600;
      }

      .startup-workspace {
        display: grid;
        place-items: center;
        background: #f7f7f8;
      }

      .startup-status {
        color: #6b7280;
        font-size: 12px;
      }
    </style>
  </head>
  <body>
    <div id="root">
      <div class="startup-shell" aria-label="正在启动 Electronic Journey">
        <aside class="startup-sidebar">资料库</aside>
        <main class="startup-workspace">
          <span class="startup-status">正在打开本地资料库…</span>
        </main>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
