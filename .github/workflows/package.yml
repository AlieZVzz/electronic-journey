name: Package desktop apps

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: package-${{ github.ref }}
  cancel-in-progress: false

jobs:
  package:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS Apple Silicon
            runner: macos-15
            target: aarch64-apple-darwin
            bundles: dmg,app
          - name: macOS Intel
            runner: macos-15-intel
            target: x86_64-apple-darwin
            bundles: dmg,app
          - name: Windows x64
            runner: windows-latest
            target: x86_64-pc-windows-msvc
            bundles: msi,nsis

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20.19.5
          cache: npm

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: package-${{ matrix.target }}

      - name: Install frontend dependencies
        run: npm ci

      - name: Check release version
        env:
          RELEASE_TAG: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || '' }}
        run: npm run check:version -- "$RELEASE_TAG"
        shell: bash

      - name: Configure optional Apple signing
        if: runner.os == 'macOS'
        shell: bash
        env:
          APPLE_CERTIFICATE_SECRET: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD_SECRET: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY_SECRET: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID_SECRET: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD_SECRET: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID_SECRET: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          if [[ -n "$APPLE_CERTIFICATE_SECRET" ]]; then
            printf 'APPLE_CERTIFICATE=%s\n' "$APPLE_CERTIFICATE_SECRET" >> "$GITHUB_ENV"

            if [[ -n "$APPLE_CERTIFICATE_PASSWORD_SECRET" ]]; then
              printf 'APPLE_CERTIFICATE_PASSWORD=%s\n' "$APPLE_CERTIFICATE_PASSWORD_SECRET" >> "$GITHUB_ENV"
            fi

            if [[ -n "$APPLE_SIGNING_IDENTITY_SECRET" ]]; then
              printf 'APPLE_SIGNING_IDENTITY=%s\n' "$APPLE_SIGNING_IDENTITY_SECRET" >> "$GITHUB_ENV"
            fi
          fi

          if [[ -n "$APPLE_ID_SECRET" && -n "$APPLE_PASSWORD_SECRET" && -n "$APPLE_TEAM_ID_SECRET" ]]; then
            printf 'APPLE_ID=%s\n' "$APPLE_ID_SECRET" >> "$GITHUB_ENV"
            printf 'APPLE_PASSWORD=%s\n' "$APPLE_PASSWORD_SECRET" >> "$GITHUB_ENV"
            printf 'APPLE_TEAM_ID=%s\n' "$APPLE_TEAM_ID_SECRET" >> "$GITHUB_ENV"
          fi

      - name: Build desktop packages
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        with:
          tagName: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || '' }}
          releaseName: ${{ startsWith(github.ref, 'refs/tags/') && 'Electronic Journey v__VERSION__' || '' }}
          releaseBody: ${{ startsWith(github.ref, 'refs/tags/') && '自动构建的 macOS 与 Windows 安装包。发布工作流已验证所有预期安装包齐全；代码签名状态与安装提示请参阅 README。' || '' }}
          releaseDraft: true
          prerelease: ${{ contains(github.ref_name, '-') }}
          generateReleaseNotes: ${{ startsWith(github.ref, 'refs/tags/') }}
          uploadWorkflowArtifacts: true
          uploadUpdaterJson: false
          updaterJsonPreferNsis: true
          workflowArtifactNamePattern: electronic-journey-[version]-[platform]-[arch]-[bundle]
          releaseAssetNamePattern: electronic-journey_[version]_[platform]_[arch][ext]
          args: --target ${{ matrix.target }} --bundles ${{ matrix.bundles }}

  publish:
    name: Publish complete release
    if: startsWith(github.ref, 'refs/tags/')
    needs: package
    runs-on: ubuntu-latest
    steps:
      - name: Verify release assets
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          expected_assets=(
            "electronic-journey_${version}_darwin_aarch64.dmg"
            "electronic-journey_${version}_darwin_x64.dmg"
            "electronic-journey_${version}_darwin_aarch64.app.tar.gz"
            "electronic-journey_${version}_darwin_aarch64.app.tar.gz.sig"
            "electronic-journey_${version}_darwin_x64.app.tar.gz"
            "electronic-journey_${version}_darwin_x64.app.tar.gz.sig"
            "electronic-journey_${version}_windows_x64.exe"
            "electronic-journey_${version}_windows_x64.exe.sig"
            "electronic-journey_${version}_windows_x64.msi"
          )

          if [[ "$(gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --json isDraft --jq '.isDraft')" != "true" ]]; then
            echo "Release $GITHUB_REF_NAME is missing or is not a draft." >&2
            exit 1
          fi

          mapfile -t actual_assets < <(
            gh release view "$GITHUB_REF_NAME" \
              --repo "$GITHUB_REPOSITORY" \
              --json assets \
              --jq '.assets[].name'
          )

          for expected_asset in "${expected_assets[@]}"; do
            if ! printf '%s\n' "${actual_assets[@]}" | grep -Fqx -- "$expected_asset"; then
              echo "Release asset is missing: $expected_asset" >&2
              exit 1
            fi
          done

      - name: Check out manifest generator
        uses: actions/checkout@v4

      - name: Generate updater manifest
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          signature_dir="$RUNNER_TEMP/updater-signatures"
          mkdir -p "$signature_dir"
          gh release download "$GITHUB_REF_NAME" \
            --repo "$GITHUB_REPOSITORY" \
            --pattern '*.sig' \
            --dir "$signature_dir"
          node scripts/generate-updater-manifest.mjs \
            "$version" \
            "$GITHUB_REPOSITORY" \
            "$signature_dir" \
            "$RUNNER_TEMP/latest.json"
          gh release upload "$GITHUB_REF_NAME" \
            "$RUNNER_TEMP/latest.json" \
            --repo "$GITHUB_REPOSITORY" \
            --clobber

      - name: Verify updater manifest is published
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release view "$GITHUB_REF_NAME" \
            --repo "$GITHUB_REPOSITORY" \
            --json assets \
            --jq '.assets[].name' | grep -Fqx -- 'latest.json'

      - name: Publish release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release edit "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --draft=false
