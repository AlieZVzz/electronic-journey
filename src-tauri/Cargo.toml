[package]
name = "electronic-journey-desktop"
version.workspace = true
description = "Electronic Journey local-first desktop client"
authors.workspace = true
edition.workspace = true
publish = false
default-run = "electronic-journey-desktop"

[lib]
name = "electronic_journey_desktop"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
async-trait.workspace = true
chrono.workspace = true
hex = "0.4"
image = { version = "0.25", default-features = false, features = ["webp"] }
iana-time-zone = "0.1"
serde.workspace = true
serde_json.workspace = true
sha2 = "0.10"
sqlx = { version = "0.8", features = ["chrono", "migrate", "runtime-tokio", "sqlite", "uuid"] }
tauri = { version = "2", features = ["tray-icon"] }
thiserror.workspace = true
tokio.workspace = true
tracing.workspace = true
uuid.workspace = true
zeroize = { version = "1", features = ["derive"] }

[target.'cfg(target_os = "macos")'.dependencies]
core-graphics = "0.25"

[target.'cfg(target_os = "windows")'.dependencies]
windows = { version = "0.61", features = [
    "Graphics_Capture",
    "Security_Authorization_AppCapabilityAccess",
] }
